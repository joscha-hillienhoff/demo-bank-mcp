[project]
name = "demo-bank-mcp"
version = "0.1.0"
description = "MCP server that connects AI assistants to the API of a fictional bank"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp[cli]>=1.2,<2",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[project.scripts]
demo-bank-mcp = "demo_bank_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_bank_mcp", "mock_bank"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies and query parameters as argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
